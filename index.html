<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuntimeRogue</title>
  </head>
  <body>
    <div id="menu-screen"></div>
    <div id="char-select-screen" class="hidden"></div>

    <div id="canvas-root" class="hidden">
      <!-- 自由キャンバス -->
      <div id="canvas"></div>

      <!-- 固定HUD（キャンバス外） -->
      <div id="hud">
        <button id="home-btn">🏠</button>
        <button id="add-main-btn">📝 メイン追加</button>
        <button id="add-lib-btn">📚 ライブラリ追加</button>
        <button id="editor-preset-btn">🧩 エディタプリセット</button>
        <button id="end-turn-btn">ターン終了 ⏎</button>
        <button id="reset-view-btn" title="ビューをリセット">⌂</button>
        <span id="stage-label" class="stage-label">STAGE 1 / 6</span>
        <span id="zoom-label" title="エディタ上ではCtrl+ホイールでズームできます">100%</span>
      </div>

      <!-- 勝敗オーバーレイ -->
      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <div id="overlay-text"></div>
          <button id="restart-btn">もう一度</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
